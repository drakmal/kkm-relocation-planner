name: Cleanup Pending Verifications

# Deletes expired, unconfirmed email-verification links once a day.
# Confirmed links are removed immediately at confirm-time; this only ever
# cleans up abandoned links nobody clicked before they expired.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_scripts/requirements.txt

      - name: Delete expired pending verifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python python_scripts/cleanup_pending_verifications.py
